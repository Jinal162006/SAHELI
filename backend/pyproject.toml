[project]
name = "saheli-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S101",  # assert is fine in tests and import-time invariants
  "B008",  # FastAPI dependencies are declared as defaults
  "E501",  # line length is handled by the formatter
  "S105",  # false positives on words like "token" in constant names
  "S608",  # SQL strings are only built from fixed table names in migrations/tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]
